spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:car_sharing}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

jwt.secret=${JWT_SECRET:mojaTajnaSekretnaWartosc}
jwt.expiration=${JWT_EXPIRATION:3600000}

stripe.api.key=${STRIPE_API_KEY:sk_test_domyslny}

telegram.bot.token=YOUR_BOT_TOKEN_HERE
telegram.chat.id=YOUR_CHAT_ID_HERE